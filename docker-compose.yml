# Local stack mirroring production: API + worker against Neon (or local Postgres) and S3-compatible MinIO.
services:
  api:
    build: .
    env_file: .env
    environment:
      STORAGE_BACKEND: s3
      S3_BUCKET: fixbridge-media
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
      AWS_REGION: us-east-1
    ports: ["8000:8000"]
    depends_on: [minio]
  worker:
    build: .
    command: ["python", "-m", "scripts.worker"]
    env_file: .env
    environment:
      STORAGE_BACKEND: s3
      S3_BUCKET: fixbridge-media
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
      AWS_REGION: us-east-1
    depends_on: [minio]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000"]
